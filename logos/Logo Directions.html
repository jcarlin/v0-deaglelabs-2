<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deagle Labs — 3 Logo Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --void: #0A0A09;
    --paper: #F2EFE7;
    --ink: #1B1B18;
    --muted: #6C6C64;
    --steel: #9A9A93;
    --coral: #F26B5C;
    --blue: #5C9CFF;
    --border: #2A2A24;
    --border-light: #D6D2C4;
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Geist", system-ui, sans-serif;
    background: #15151310;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ---- shared plate styles ---- */
  .plate {
    border-radius: 14px;
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    height: 100%;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }
  .plate.dark {
    background: var(--void);
    color: var(--paper);
  }
  .plate.light {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--border-light);
  }
  .plate.light-white {
    background: #FFFFFF;
    color: var(--ink);
    border: 1px solid #E8E6DD;
  }

  .plate-label {
    font-family: "Geist Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--steel);
  }
  .plate.light .plate-label, .plate.light-white .plate-label { color: var(--muted); }

  .hairline {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0;
  }
  .plate.light .hairline, .plate.light-white .hairline { border-top-color: var(--border-light); }

  /* ---- rationale card ---- */
  .rationale {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .rationale h3 {
    margin: 0;
    font-size: 32px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    font-weight: 600;
  }
  .rationale .tagline {
    font-family: "Geist Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--coral);
  }
  .rationale p {
    margin: 0;
    font-size: 15px;
    line-height: 1.55;
    color: var(--muted);
    max-width: 52ch;
  }
  .rationale .lede {
    font-size: 17px;
    color: var(--ink);
    line-height: 1.5;
  }
  .plate.dark .rationale .lede { color: var(--paper); }
  .plate.dark .rationale p { color: var(--steel); }

  .spec-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px 20px;
    font-size: 13px;
  }
  .spec-grid dt {
    font-family: "Geist Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--steel);
    padding-top: 3px;
  }
  .plate.light .spec-grid dt, .plate.light-white .spec-grid dt { color: var(--muted); }
  .spec-grid dd {
    margin: 0;
    color: var(--ink);
    line-height: 1.5;
  }
  .plate.dark .spec-grid dd { color: var(--paper); }

  /* ---- lockup plate ---- */
  .lockup-plate {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
  }

  /* ---- mark grid (3 sizes) ---- */
  .mark-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 24px;
    align-items: end;
  }
  .mark-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .mark-cell .size {
    font-family: "Geist Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--steel);
  }
  .plate.light .mark-cell .size, .plate.light-white .mark-cell .size { color: var(--muted); }

  /* ---- favicon strip ---- */
  .favicon-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    align-items: end;
  }
  .fav-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .fav-chip {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    display: grid;
    place-items: center;
  }
  .plate.light .fav-chip, .plate.light-white .fav-chip {
    background: rgba(0,0,0,0.02);
    border-color: var(--border-light);
  }
  .fav-meta {
    font-family: "Geist Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--steel);
  }
  .plate.light .fav-meta, .plate.light-white .fav-meta { color: var(--muted); }

  /* ---- browser tab mockup ---- */
  .tab-mock {
    background: #E8E6DE;
    border-radius: 10px 10px 0 0;
    padding: 8px 10px 0 10px;
    display: inline-flex;
    gap: 6px;
    align-items: flex-end;
  }
  .tab-mock.dark { background: #1F1F1B; }
  .tab {
    background: #FDFBF5;
    padding: 6px 12px 7px 8px;
    border-radius: 6px 6px 0 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink);
    font-weight: 500;
    max-width: 140px;
  }
  .tab-mock.dark .tab { background: var(--void); color: var(--paper); }
  .tab .tab-title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---- construction notes artboard ---- */
  .construction {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: center;
  }
  .construction .diagram {
    display: grid;
    place-items: center;
    min-height: 240px;
  }

  /* Background grid for construction */
  .grid-bg {
    background-image:
      linear-gradient(to right, rgba(154,154,147,0.1) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(154,154,147,0.1) 1px, transparent 1px);
    background-size: 12px 12px;
    border-radius: 10px;
    padding: 24px;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Shared logo components -->
<script type="text/babel" src="logos.jsx"></script>
<!-- Design canvas -->
<script type="text/babel" src="../design-canvas.jsx"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState } = React;

// ----- shared helpers -----
function Plate({ tone = 'dark', label, children, style }) {
  const cls = tone === 'dark' ? 'plate dark' : tone === 'white' ? 'plate light-white' : 'plate light';
  return (
    <div className={cls} style={style}>
      {label && <div className="plate-label">{label}</div>}
      {children}
    </div>
  );
}

function Rationale({ tone, tagline, title, lede, body, specs }) {
  return (
    <Plate tone={tone}>
      <div className="rationale">
        <div className="tagline">{tagline}</div>
        <h3>{title}</h3>
        <p className="lede">{lede}</p>
        <hr className="hairline" />
        <p>{body}</p>
        <hr className="hairline" />
        <dl className="spec-grid">
          {specs.map(([k,v],i) => <React.Fragment key={i}><dt>{k}</dt><dd>{v}</dd></React.Fragment>)}
        </dl>
      </div>
    </Plate>
  );
}

function MarkRow({ tone, Comp, accent, ink }) {
  return (
    <Plate tone={tone} label="MARK · THREE SIZES">
      <div className="mark-row">
        <div className="mark-cell">
          <Comp size={96} ink={ink} accent={accent} bg={tone === 'dark' ? '#0A0A09' : tone === 'white' ? '#FFFFFF' : '#F2EFE7'} />
          <div className="size">96 PX</div>
        </div>
        <div className="mark-cell">
          <Comp size={56} ink={ink} accent={accent} bg={tone === 'dark' ? '#0A0A09' : tone === 'white' ? '#FFFFFF' : '#F2EFE7'} />
          <div className="size">56 PX</div>
        </div>
        <div className="mark-cell">
          <Comp size={28} ink={ink} accent={accent} bg={tone === 'dark' ? '#0A0A09' : tone === 'white' ? '#FFFFFF' : '#F2EFE7'} />
          <div className="size">28 PX</div>
        </div>
      </div>
    </Plate>
  );
}

function FaviconRow({ tone, Comp, accent, ink }) {
  const bg = tone === 'dark' ? '#0A0A09' : tone === 'white' ? '#FFFFFF' : '#F2EFE7';
  return (
    <Plate tone={tone} label="FAVICON · BROWSER CHROME">
      <div className="favicon-row">
        <div className="fav-cell">
          <div className="fav-chip"><Comp size={48} ink={ink} accent={accent} bg={bg} /></div>
          <div className="fav-meta">48 PX</div>
        </div>
        <div className="fav-cell">
          <div className="fav-chip"><Comp size={32} ink={ink} accent={accent} bg={bg} /></div>
          <div className="fav-meta">32 PX</div>
        </div>
        <div className="fav-cell">
          <div className="fav-chip"><Comp size={16} ink={ink} accent={accent} bg={bg} /></div>
          <div className="fav-meta">16 PX</div>
        </div>
        <div className="fav-cell">
          <div className={tone === 'dark' ? 'tab-mock dark' : 'tab-mock'}>
            <div className="tab">
              <Comp size={14} ink={ink} accent={accent} bg={bg} />
              <span className="tab-title">Deagle — Legal AI</span>
            </div>
          </div>
          <div className="fav-meta">IN-TAB</div>
        </div>
      </div>
    </Plate>
  );
}

function LockupPlate({ tone, Wordmark, ink, accent, bg }) {
  return (
    <Plate tone={tone} label={tone === 'dark' ? 'LOCKUP · DARK' : tone === 'white' ? 'LOCKUP · WHITE' : 'LOCKUP · PAPER'}>
      <div className="lockup-plate">
        <Wordmark height={52} ink={ink} accent={accent} bg={bg} />
      </div>
    </Plate>
  );
}

// ---- Construction diagrams ----
function SealConstruction() {
  return (
    <svg width="280" height="280" viewBox="0 0 120 120" fill="none">
      {/* grid guides */}
      <g opacity="0.25" stroke="#5C9CFF" strokeWidth="0.3">
        <circle cx="60" cy="60" r="54" fill="none" />
        <circle cx="60" cy="60" r="49" fill="none" />
        <circle cx="60" cy="60" r="22" fill="none" />
        <line x1="60" y1="0" x2="60" y2="120" />
        <line x1="0" y1="60" x2="120" y2="60" />
      </g>
      {/* the mark */}
      <circle cx="60" cy="60" r="54" stroke="#F2EFE7" strokeWidth="2" fill="none" />
      <circle cx="60" cy="60" r="49" stroke="#F2EFE7" strokeWidth="0.8" fill="none" opacity="0.55" />
      <path d="M 40 38 L 62 38 C 75 38 84 47 84 60 C 84 73 75 82 62 82 L 40 82 Z" stroke="#F2EFE7" strokeWidth="2.8" fill="none" />
      <circle cx="69" cy="60" r="3" fill="#F26B5C" />
      <line x1="69" y1="52" x2="69" y2="56" stroke="#F26B5C" strokeWidth="1.6" />
      <line x1="69" y1="64" x2="69" y2="68" stroke="#F26B5C" strokeWidth="1.6" />
      <line x1="61" y1="60" x2="65" y2="60" stroke="#F26B5C" strokeWidth="1.6" />
      <line x1="73" y1="60" x2="77" y2="60" stroke="#F26B5C" strokeWidth="1.6" />
      {/* construction labels */}
      <text x="60" y="9" fill="#5C9CFF" fontSize="4" textAnchor="middle" fontFamily="Geist Mono">r=54</text>
    </svg>
  );
}

function CitationConstruction() {
  return (
    <svg width="280" height="280" viewBox="0 0 120 120" fill="none">
      <g opacity="0.25" stroke="#5C9CFF" strokeWidth="0.3">
        <line x1="30" y1="0" x2="30" y2="120" />
        <line x1="90" y1="0" x2="90" y2="120" />
        <line x1="0" y1="60" x2="120" y2="60" />
        <line x1="0" y1="22" x2="120" y2="22" />
        <line x1="0" y1="98" x2="120" y2="98" />
      </g>
      <line x1="30" y1="22" x2="30" y2="98" stroke="#F2EFE7" strokeWidth="6" strokeLinecap="square" />
      <path d="M 30 22 L 62 22 C 78 22 90 34 90 50 C 90 60 84 66 76 66" stroke="#F2EFE7" strokeWidth="6" fill="none" strokeLinecap="square" />
      <path d="M 44 54 C 36 54 30 60 30 70 C 30 86 42 98 58 98 L 90 98" stroke="#F2EFE7" strokeWidth="6" fill="none" strokeLinecap="square" />
      <circle cx="74" cy="36" r="3.5" fill="#F26B5C" />
      <circle cx="46" cy="84" r="3.5" fill="#F26B5C" />
    </svg>
  );
}

function RedactionConstruction() {
  return (
    <svg width="280" height="280" viewBox="0 0 120 120" fill="none">
      <g opacity="0.25" stroke="#5C9CFF" strokeWidth="0.3">
        <line x1="14" y1="0" x2="14" y2="120" />
        <line x1="106" y1="0" x2="106" y2="120" />
        <line x1="60" y1="0" x2="60" y2="120" />
        <line x1="0" y1="38" x2="120" y2="38" />
        <line x1="0" y1="82" x2="120" y2="82" />
        <line x1="0" y1="60" x2="120" y2="60" />
      </g>
      <rect x="14" y="38" width="92" height="44" fill="#F2EFE7" />
      <path d="M 106 38 L 80 38 C 68 38 60 46 60 60 C 60 74 68 82 80 82 L 106 82 Z" fill="#0A0A09" />
      <circle cx="78" cy="60" r="3.5" fill="#F26B5C" />
    </svg>
  );
}


// ============ ASSEMBLY ============
function App() {
  const DIRECTIONS = [
    {
      id: 'seal',
      name: 'The Seal',
      Mark: SealMark,
      Wordmark: SealWordmark,
      Construction: SealConstruction,
      tagline: 'DIRECTION 01 · AUTHORITY',
      title: 'The Seal',
      lede: 'A modernized court seal. The D held inside a precision ring, with a pin-cite crosshair marking the verified point.',
      body: 'Borrows the visual authority of notarial and court seals — a form every litigator reads as "this is official, this is verified." The crosshair is the Deagle twist: it\'s the pin-cite. Where the citation lands. The point of truth in the document. Reads at 16px because the crosshair stays centered and the ring remains a circle; the D reduces to its core strokes.',
      specs: [
        ['FEEL', 'Official, judicial, institutional'],
        ['METAPHOR', 'Pin-cite as the center of authority'],
        ['STRENGTH', 'Signals trust instantly; reads in legal contexts'],
        ['RISK', 'Close to generic "seal" territory; depends on execution'],
        ['BEST FOR', 'Formal brand expressions — DPAs, court filings, emails'],
      ],
    },
    {
      id: 'citation',
      name: 'The Citation',
      Mark: CitationMark,
      Wordmark: CitationWordmark,
      Construction: CitationConstruction,
      tagline: 'DIRECTION 02 · LITERATE',
      title: 'The Citation',
      lede: 'A D-form assembled from two interlocking arcs with § dots — reads as both the letter D and the rhythm of a section-sign.',
      body: 'Built from the vocabulary litigators already know. The two bowls of the D offset slightly, creating the visual cadence of § — the most-used symbol in American legal writing. Two coral cite-dots mark the junctions, referencing paragraph and pin-cite. Quieter than the seal, more modern; a mark for a brand that wants to feel native to the legal document.',
      specs: [
        ['FEEL', 'Literate, precise, legal-native'],
        ['METAPHOR', '§ section-sign embedded in the D'],
        ['STRENGTH', 'Only mark of the three that speaks "law" via typography'],
        ['RISK', 'Needs 20px+ for the § rhythm to read'],
        ['BEST FOR', 'Product surfaces, docs, the marketing site'],
      ],
    },
    {
      id: 'redaction',
      name: 'The Redaction',
      Mark: RedactionMark,
      Wordmark: RedactionWordmark,
      Construction: RedactionConstruction,
      tagline: 'DIRECTION 03 · PRIVILEGED',
      title: 'The Redaction',
      lede: 'A redaction bar with a D carved into its right edge — as if the bar is lifting to reveal verified content underneath.',
      body: 'The most conceptually direct of the three. Redaction is the daily reality of privilege-safe work; no other brand in legal tech owns it. The negative space is the brand story: what\'s hidden stays hidden, what\'s cleared gets revealed — with a single coral dot for the verified pin-cite. Bold, distinctive, ownable. A bit riskier because it depends on you standing firmly behind the metaphor.',
      specs: [
        ['FEEL', 'Bold, confident, contemporary'],
        ['METAPHOR', 'Redaction bar "lifting" to reveal verified text'],
        ['STRENGTH', 'Highly ownable, direct connection to privilege'],
        ['RISK', 'Requires solid bar; struggles on busy backgrounds'],
        ['BEST FOR', 'Marketing, social, app icon, category ownership'],
      ],
    },
  ];

  const sections = DIRECTIONS.map((d, idx) => {
    const { Mark, Wordmark, Construction } = d;

    return (
      <DCSection id={d.id} title={`${String(idx+1).padStart(2,'0')} · ${d.name}`} key={d.id}>
        {/* Rationale */}
        <DCArtboard id={`${d.id}-rationale`} label="Rationale" width={560} height={640}>
          <Rationale tone="dark" tagline={d.tagline} title={d.title} lede={d.lede} body={d.body} specs={d.specs} />
        </DCArtboard>

        {/* Primary lockup on dark */}
        <DCArtboard id={`${d.id}-lockup-dark`} label="Lockup — Dark" width={560} height={260}>
          <LockupPlate tone="dark" Wordmark={Wordmark} ink={PALETTE.paper} accent={PALETTE.coral} bg={PALETTE.void} />
        </DCArtboard>

        {/* Primary lockup on cream */}
        <DCArtboard id={`${d.id}-lockup-paper`} label="Lockup — Paper" width={560} height={260}>
          <LockupPlate tone="paper" Wordmark={Wordmark} ink={PALETTE.ink} accent={PALETTE.coral} bg={PALETTE.paper} />
        </DCArtboard>

        {/* Primary lockup on white */}
        <DCArtboard id={`${d.id}-lockup-white`} label="Lockup — White" width={560} height={260}>
          <LockupPlate tone="white" Wordmark={Wordmark} ink={PALETTE.ink} accent={PALETTE.coral} bg="#FFFFFF" />
        </DCArtboard>

        {/* Mark scales — dark */}
        <DCArtboard id={`${d.id}-marks-dark`} label="Marks — Dark" width={560} height={340}>
          <MarkRow tone="dark" Comp={Mark} accent={PALETTE.coral} ink={PALETTE.paper} />
        </DCArtboard>

        {/* Mark scales — paper */}
        <DCArtboard id={`${d.id}-marks-paper`} label="Marks — Paper" width={560} height={340}>
          <MarkRow tone="paper" Comp={Mark} accent={PALETTE.coral} ink={PALETTE.ink} />
        </DCArtboard>

        {/* Favicons — dark */}
        <DCArtboard id={`${d.id}-fav-dark`} label="Favicons — Dark" width={760} height={260}>
          <FaviconRow tone="dark" Comp={Mark} accent={PALETTE.coral} ink={PALETTE.paper} />
        </DCArtboard>

        {/* Favicons — paper */}
        <DCArtboard id={`${d.id}-fav-paper`} label="Favicons — Paper" width={760} height={260}>
          <FaviconRow tone="paper" Comp={Mark} accent={PALETTE.coral} ink={PALETTE.ink} />
        </DCArtboard>

        {/* Construction diagram */}
        <DCArtboard id={`${d.id}-construction`} label="Construction" width={560} height={460}>
          <Plate tone="dark" label="GEOMETRY · GUIDES">
            <div className="grid-bg" style={{ display: 'grid', placeItems: 'center', flex: 1 }}>
              <Construction />
            </div>
          </Plate>
        </DCArtboard>
      </DCSection>
    );
  });

  return (
    <DesignCanvas title="Deagle Labs · 3 Logo Directions" subtitle="Drag to pan · scroll to zoom · click any artboard to focus">
      {/* Intro section */}
      <DCSection id="brief" title="00 · Brief">
        <DCArtboard id="brief-card" label="The Ask" width={800} height={440}>
          <Plate tone="dark">
            <div className="rationale">
              <div className="tagline">A FRESH AUDIT · THREE DIRECTIONS</div>
              <h3 style={{ fontSize: 44, lineHeight: 1.1, maxWidth: '22ch' }}>Three marks. Three brand stories. One decision.</h3>
              <p className="lede">
                Each direction takes a different stance on what Deagle is at its core —
                authoritative, literate, or privileged. All three work at 16px, all three
                compose with the existing Geist wordmark, all three stay in palette.
              </p>
              <hr className="hairline" />
              <p>
                Scroll right to see each direction with its rationale, primary lockup on three
                surfaces, mark at three scales, favicon tests (including a live-ish browser tab
                mockup), and construction geometry. Click any artboard to fullscreen it. Once
                you've picked a favorite, I'll produce the final SVG + PNG files and swap the
                site over.
              </p>
            </div>
          </Plate>
        </DCArtboard>

        <DCArtboard id="current" label="For reference — current mark" width={340} height={440}>
          <Plate tone="dark" label="CURRENT MARK · SHIPPED">
            <div style={{ display: 'grid', placeItems: 'center', flex: 1 }}>
              <svg width="140" height="140" viewBox="0 0 32 32" fill="none">
                <path d="M5 5 H16 C23 5 27 10 27 16 C27 22 23 27 16 27 H5 Z" stroke="#F2EFE7" strokeWidth="2.4" fill="none" strokeLinejoin="miter"/>
                <line x1="4" y1="28" x2="21" y2="11" stroke="#F26B5C" strokeWidth="2.4" strokeLinecap="square"/>
                <circle cx="19" cy="16" r="2.4" fill="#F26B5C"/>
              </svg>
            </div>
            <p style={{ fontSize: 13, color: '#9A9A93', textAlign: 'center', margin: 0, lineHeight: 1.5 }}>
              D with diagonal cut-line.<br/>Coral dot marks the verified point.
            </p>
          </Plate>
        </DCArtboard>
      </DCSection>

      {sections}
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
